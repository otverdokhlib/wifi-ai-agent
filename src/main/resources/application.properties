spring.application.name=wifi-ai-agent

# RouterOS REST API. Credentials must be supplied through environment variables.
routeros.base-url=${ROUTEROS_BASE_URL:https://192.168.88.1}
routeros.username=${ROUTEROS_USERNAME:}
routeros.password=${ROUTEROS_PASSWORD:}


# DEVELOPMENT ONLY: trust the router's self-signed TLS certificate. Never enable in production.
routeros.ssl.insecure=${ROUTEROS_SSL_INSECURE:false}

spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.model=llama3.2:3b
spring.ai.ollama.embedding.model=nomic-embed-text

logging.level.org.springframework.ai=DEBUG
spring.ai.ollama.chat.temperature=0
spring.ai.ollama.chat.num-predict=256
spring.ai.ollama.chat.keep-alive=30m
# Ask Ollama to offload as many layers as possible when a supported GPU is available.
spring.ai.ollama.chat.num-gpu=-1
spring.ai.ollama.embedding.keep_alive=10s

# Keep the RAG contribution small enough to leave room for prompt, history and tool results.
wifi.agent.rag.top-k=2
wifi.agent.rag.similarity-threshold=0.4
wifi.agent.rag.chunk-size=1000

# Agent-loop guardrails. A Wi-Fi turn should normally need one telemetry call;
# these limits still allow a corrective second step without permitting a runaway loop.
wifi.agent.loop.max-calls-per-tool=2
wifi.agent.loop.max-total-tool-calls=4
